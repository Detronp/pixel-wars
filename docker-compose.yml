services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # persist the board to disk
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    image: pixel-wars:latest
    environment:
      REDIS_URL: redis://redis:6379/0
      COOLDOWN_SECONDS: "3"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}        # set in .env to enable /api/reset
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 3                          # three app containers behind Nginx
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 2s
      retries: 3
    restart: unless-stopped

volumes:
  redis-data:
