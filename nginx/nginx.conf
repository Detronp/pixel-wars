worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    sendfile      on;
    gzip          on;
    gzip_types    application/json text/css application/javascript;

    # Docker's internal DNS. Re-resolving "web" lets Nginx find every replica,
    # including ones added later with `docker compose up --scale web=N`.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Second line of defence against paint spam (the app also enforces a cooldown).
    limit_req_zone $binary_remote_addr zone=paint:10m rate=2r/s;

    log_format main '$remote_addr "$request" $status -> $upstream_addr';
    access_log /dev/stdout main;

    server {
        listen 80;
        set $app http://web:8000;

        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        location = /api/pixel {
            limit_req zone=paint burst=5 nodelay;
            limit_req_status 429;
            proxy_pass $app;
        }

        location /static/ {
            proxy_pass $app;
            expires 1h;
        }

        location / {
            proxy_pass $app;
        }

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }
    }
}
